$font = FiraCode Nerd Font

source = colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/wallpaper.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(505050ff)

    outer_color = $main_color $secondary_color 45deg
    check_color = $main_color $secondary_color 135deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgba(8f8f8fff)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# time in 24hr format
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr "[:upper:]" "[:lower:]"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
